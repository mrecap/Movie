
<!doctype html>
<html>
<head>
<title>Wandee Recap v6</title>
<style>
body{background:#071323;color:white;font-family:Arial;padding:40px}
.box{background:#102238;padding:25px;border-radius:15px;max-width:700px}
button{padding:12px 20px;border-radius:10px;background:#2378ff;color:white;border:0}
textarea{width:100%;height:200px;background:#08192d;color:white}
</style>
</head>
<body>
<div class="box">
<h1>Wandee Recap v6</h1>

<p>This version uses Google Apps Script backend.</p>

<input id="url" placeholder="Apps Script Web App URL" style="width:100%;padding:10px">

<br><br>

<button onclick="test()">Test Backend</button>

<h3>Prompt</h3>
<textarea id="p">Create a Myanmar movie recap script.</textarea>

<button onclick="generate()">Generate</button>

<h3>Result</h3>
<textarea id="r"></textarea>

</div>

<script>
async function test(){
 let u=document.getElementById("url").value;
 let x=await fetch(u,{method:"POST",
 body:JSON.stringify({action:"test"})});
 alert(await x.text());
}

async function generate(){
 let u=document.getElementById("url").value;
 let p=document.getElementById("p").value;

 let x=await fetch(u,{
 method:"POST",
 body:JSON.stringify({
 action:"generate",
 prompt:p
 })
 });

 let j=await x.json();
 document.getElementById("r").value=j.text||j.error;
}
</script>
</body>
</html>
