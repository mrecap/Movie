<!doctype html>
<html><body style="background:#071323;color:white;font-family:Arial;padding:30px">
<h1>Wandee Recap v7</h1>
<input id="url" style="width:500px" placeholder="Apps Script Web App URL"><br><br>
<button onclick="test()">Test</button>
<textarea id="p" style="width:500px;height:120px">Create a Myanmar movie recap script.</textarea><br>
<button onclick="gen()">Generate</button>
<textarea id="r" style="width:500px;height:200px"></textarea>
<script>
async function test(){
let r=await fetch(url.value,{method:"POST",body:JSON.stringify({action:"test"})});
alert(await r.text());
}
async function gen(){
let r=await fetch(url.value,{method:"POST",body:JSON.stringify({action:"generate",prompt:p.value})});
let j=await r.json();result=j.text||j.error;
document.getElementById("r").value=result;
}
</script>
</body></html>
