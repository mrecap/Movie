<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wandee Recap v8</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🎬 Wandee Recap</h1>
<nav>
<button>🔊 Voiceover</button>
<button>✨ Auto Transcript</button>
<button>▣ SRT Generator</button>
<button>📜 Script Writer</button>
<button>🌐 Shorts Translator</button>
<button>🖼 Thumbnail Maker</button>
<button>⌫ Logo Remover</button>
</nav>
</header>

<main>
<h2>✨ Auto Transcript Studio</h2>

<div class="grid">
<section class="card">
<h3>Video / Audio</h3>
<input type="file" id="file">
<p>MP4, WebM, MOV, MP3, WAV</p>
<button onclick="upload()">Upload</button>
<div id="status"></div>
</section>

<section class="card">
<h3>Output Language</h3>
<select id="lang">
<option>Myanmar</option>
<option>English</option>
<option>Thai</option>
<option>Chinese</option>
</select>
<button onclick="generate()">Generate Transcript</button>
</section>
</div>

<textarea id="result" placeholder="Result appears here..."></textarea>

</main>

<script src="app.js"></script>
</body>
</html>
